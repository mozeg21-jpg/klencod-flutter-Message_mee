name: ahmed_saad_community
description: Ahmed Saad Community chat with offline Base64 voice/image/video messages.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  firebase_database: ^11.1.6
  shared_preferences: ^2.3.3
  flutter_sound: ^9.28.0
  audioplayers: ^6.1.0
  device_info_plus: ^11.1.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  # اختيار الصور والفيديوهات من المعرض
  image_picker: ^1.1.2
  # تشغيل الفيديوهات داخل فقاعة الرسالة
  video_player: ^2.9.2
  # إشعارات محلية للرسائل الجديدة والردود
  flutter_local_notifications: ^17.2.4
  # خدمة خلفية: إشعارات والتطبيق مقفول (بدون خادم وبدون تكلفة)
  flutter_background_service: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
# إعدادات أيقونة التطبيق الخارجية (شاشة الجهاز الرئيسية)
flutter_launcher_icons:
  android: true
  # المشروع أندرويد فقط (لا يوجد مجلد ios) → iOS معطل حتى لا ينهار الأمر
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/icon_foreground.png
