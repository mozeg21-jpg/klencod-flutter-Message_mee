name: Flutter APK Build (Signed Automatically)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# مطلوبة عشان ينزل ملف APK تلقائيًا في صفحة Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app launcher icons (non-blocking)
        run: dart run flutter_launcher_icons || true

      # توقيع تلقائي بدون أي إعداد يدوي، وثلاث طبقات ضمان عشان البناء ما يوقفش:
      # 1) لو فيه سر KEYSTORE_BASE64 على المستودع نستخدمه.
      # 2) وإلا نفك ترميز المفتاح المرفق في android/signing/release-key.jks.b64.
      # 3) ولو المفتاح غير متوفر نهائيًا نحذف key.properties فيرجع Gradle لتوقيع debug
      #    التلقائي → الـ APK يبقى موقّعًا وقابلًا للتثبيت بدل فشل validateSigningRelease.
      - name: Prepare signing keystore (self-healing)
        env:
          SECRET_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          TARGET_JKS="android/app/release-key.jks"
          if [ -n "${SECRET_B64:-}" ]; then
            echo "==> Using keystore from GitHub secret KEYSTORE_BASE64"
            echo "$SECRET_B64" | base64 -d > "$TARGET_JKS"
            {
              echo "storePassword=${SECRET_STORE_PASS:-}"
              echo "keyPassword=${SECRET_KEY_PASS:-}"
              echo "keyAlias=${SECRET_ALIAS:-release}"
              echo "storeFile=release-key.jks"
            } > android/key.properties
          elif [ -s android/signing/release-key.jks.b64 ]; then
            echo "==> Decoding committed keystore android/signing/release-key.jks.b64"
            base64 -d android/signing/release-key.jks.b64 > "$TARGET_JKS"
            cp android/signing/key.properties android/key.properties
          else
            echo "::warning::No release keystore found; falling back to automatic debug signing (APK stays signed and installable)."
            rm -f android/key.properties "$TARGET_JKS"
          fi
          echo "==> Keystore status:"
          if [ -s "$TARGET_JKS" ]; then ls -l "$TARGET_JKS"; else echo "    release-key.jks absent -> debug signing will be used"; fi

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # رفع APK تلقائيًا في صفحة Releases تحت اسم tag "latest"
      # عشان تنزّل ملف التثبيت مباشرة من غير ما تدخل على الـ Actions.
      - name: Publish APK to Latest Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: أحدث نسخة مبنية تلقائيًا
          body: |
            نسخة مبنية وموقّعة تلقائيًا من GitHub Actions.
            حمّل ملف app-release.apk من المرفقات وثبته على الموبايل مباشرة.
          files: build/app/outputs/flutter-apk/app-release.apk
