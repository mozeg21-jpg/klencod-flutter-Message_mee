plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

// توقيع النسخة الإفراج (Release):
// لو ملف key.properties موجود (محليًا أو من أسرار GitHub في CI) نستخدم مفتاح التوقيع الرسمي،
// ولو مش موجود نرجع لتوقيع debug التلقائي → في كل الأحوال الـ APK يطلع موقّعًا
// فلا يظهر خطأ "الحزمة غير صالحة" عند التثبيت على الموبايل.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// جاهزية المفتاح الرسمي: لازم ملف الخصائص يكون موجودًا وملف الـ JKS نفسه موجود فعليًا.
// في الـ CI الجديد (git push) يكون ملف android/app/release-key.jks مستبعَدًا من .gitignore،
// فلو فشل توليده لأي سبب لا نبني توقيع release على ملف مفقود، بل نرجع لتوقيع debug التلقائي.
def releaseStoreFile = keystoreProperties['storeFile'] != null ? file(keystoreProperties['storeFile']) : null
def releaseSigningReady = keystorePropertiesFile.exists() &&
        releaseStoreFile != null &&
        releaseStoreFile.exists() &&
        keystoreProperties['keyAlias'] != null

android {
    namespace 'com.ahmed.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ahmed.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndkVersion "28.2.13676358"
    }
    compileOptions {
        // مطلوب من flutter_local_notifications (يعمل java.time على أندرويد القديمة)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // المفتاح الرسمي جاهز → توقيع release؛ otherwise توقيع debug تلقائي.
            // في الحالتين الـ APK موقّع وقابل للتثبيت، ولا يفشل البناء عند validateSigningRelease.
            signingConfig releaseSigningReady ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-database'
    // دعم desugaring لمكتبة الإشعارات (java.time على أندرويد 23 فأعلى)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
